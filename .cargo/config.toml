# `cargo xtask <command>` runs the automation crate in tools/Xtask.
[alias]
xtask = "run --quiet --package xtask --"

# Rust's bundled LLD links much faster than MSVC link.exe, which matters most for
# the many small relinks of an incremental dev build. `cargo xtask hot` overrides
# it back to link.exe, because dx 0.7.10 cannot drive rust-lld (Dioxus #4694).
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

# Bevy resolves "assets" relative to CARGO_MANIFEST_DIR (the app crate) by default.
# Point it at the workspace root so the shared top-level assets/ folder is used.
[env]
BEVY_ASSET_ROOT = { value = ".", relative = true }
