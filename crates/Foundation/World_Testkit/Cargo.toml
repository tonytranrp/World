proptest.workspace = true
xxhash-rust.workspace = true
image.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "dense"
harness = false

[[bench]]
name = "tree"
harness = false

[lints]
workspace = true
