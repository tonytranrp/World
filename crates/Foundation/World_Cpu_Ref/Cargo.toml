[package]
name = "world_cpu_ref"
description = "Slow, exact CPU reference ray tracer used as ground truth for the GPU tracer. No Bevy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autobenches = false

# The library's unit tests are not benchmarks, and libtest rejects Criterion's flags.
[lib]
bench = false

[dependencies]
world_core.workspace = true
# PNG encoding of reference images. Pure Rust, already in the lockfile through
# `image` (Bevy and World_Testkit); keep it on the version the lockfile has.
png = { version = "0.18.1", default-features = false }

[dev-dependencies]
world_testkit.workspace = true
world_gen.workspace = true
proptest.workspace = true
ron.workspace = true
criterion.workspace = true

# Primary rays per second against the brute-force DDA of World_Testkit.
[[bench]]
name = "trace"
harness = false

[lints]
workspace = true
