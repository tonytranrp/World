[package]
name = "world_game"
description = "Gameplay plugin: player, tools, interaction and sandbox systems."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Developer panels: entity inspector (F1), config editor (F2), re-run setup (F5).
# On in dev builds through the app's `dev` and `hotpatch` features, off in release.
dev_tools = ["dep:bevy_egui", "dep:bevy-inspector-egui"]

[dependencies]
world_core.workspace = true
world_render.workspace = true
world_reload.workspace = true
bevy.workspace = true
bevy_egui = { workspace = true, optional = true }
bevy-inspector-egui = { workspace = true, optional = true }

[dev-dependencies]
world_testkit_bevy.workspace = true
serde.workspace = true

[lints]
workspace = true
